name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game engine tests
        run: node test/run-tests.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const build = process.env.BUILD_NUMBER;
          const date = execSync('git log -1 --date=short --pretty=%cd')
            .toString().trim();
          const message = execSync('git log -1 --pretty=%s')
            .toString().trim().slice(0, 60).trim();
          fs.writeFileSync(
            'js/version.js',
            'window.APP_VERSION = ' +
              JSON.stringify({ build, date, message }) + ';\n'
          );
          // Unique cache name per deploy: installed apps refresh themselves.
          const sw = fs.readFileSync('sw.js', 'utf8')
            .replace(
              /const CACHE_NAME = 'dixmille-[\w.-]+';/,
              "const CACHE_NAME = 'dixmille-build-" + build + "';"
            );
          fs.writeFileSync('sw.js', sw);
          console.log('Stamped build', build, date, JSON.stringify(message));
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
